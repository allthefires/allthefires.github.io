      rel="stylesheet"
    />
    <!-- Favicon -->

    <style>
      /* ========================================
         COLD GALLERY PAGE
      ======================================== */

      body.cold-page {
        background-color: var(--color-bg);
        color: silver;
      }

      .cold-container {
        padding: 120px 6% 100px 6%;
        min-height: 100vh;
      }

      .cold-header-group {
        margin-bottom: 30px;
      }

      .cold-back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #a1a0a0;
        text-decoration: none;
        font-size: 0.9rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 22px;
        transition: color 0.3s ease;
      }

      .cold-back-link:hover {
        color: #e1e2e3;
      }

      .cold-back-link svg {
        transition: transform 0.3s ease;
      }

      .cold-back-link:hover svg {
        transform: translateX(-4px);
      }

      .cold-title {
        font-weight: 700;
        font-size: clamp(3.5rem, 9vw, 7rem);
        letter-spacing: 6px;
        line-height: 0.9;
        color: #dcdcdc;
        font-variation-settings:
          "XTRA" 600,
          "wdth" 125;
        margin-bottom: 0;
      }

      .cold-subtitle {
        font-weight: 300;
        font-size: clamp(0.7rem, 1.2vw, 1.1rem);
        letter-spacing: 0.67em;
        margin-right: -1.45em;
        color: #7b7b7b;
        text-transform: uppercase;
        margin-top: 8px;
      }

      /* Masonry grid */
      .cold-grid {
        columns: 3;
        column-gap: 15px;
      }

      .cold-item {
        break-inside: avoid;
        margin-bottom: 12px;
        opacity: 0;
        transform: translateY(20px);
        transition:
          opacity 0.7s ease,
          transform 0.7s ease;
      }

      .cold-item.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .cold-item-inner {
        position: relative;
        overflow: hidden;
        background: #111;
        display: block;
      }

      .cold-item-inner img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: cover;
        /*transition: transform 0.6s ease;*/
        opacity: 1 !important;
        transform: none !important;
      }

      .cold-caption {
        padding: 5px 2px 2px 2px;
        display: flex;
        gap: 7px;
        align-items: baseline;
      }

      .cold-caption-city {
        font-size: 0.75rem;
        letter-spacing: 1px;
        color: #868686;
        text-transform: uppercase;
        font-weight: 400;
      }

      .cold-caption-year {
        font-size: 0.75rem;
        letter-spacing: 1px;
        color: #8b8b8b;
        font-weight: 300;
      }

      /* Back to top */
      .back-to-top {
        position: fixed;
        bottom: 30px;
        right: 28px;
        width: 70px;
        height: 70px;
        background: #ffffff;
        border: 6px solid #9ea09f;
        color: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.4s ease,
          color 0.3s ease,
          border-color 0.3s ease;
        z-index: 999;
      }

      .back-to-top.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .back-to-top:hover {
        color: #dcdcdc;
        border-color: #444;
      }

      /* Responsive */
      @media (max-width: 991px) {
        .cold-container {
          padding: 100px 4% 80px 4%;
        }

        .cold-grid {
          columns: 2;
          column-gap: 8px;
        }

        .cold-item {
          margin-bottom: 8px;
        }

        .cold-title {
          letter-spacing: 3px;
        }

        .cold-subtitle {
          letter-spacing: 0.5em;
          margin-right: -0.6em;
        }

        .cold-header-group {
          margin-bottom: 36px;
        }
      }
    </style>
  </head>

    <footer class="visuals-footer-dark">
